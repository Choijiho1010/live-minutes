[project]
name = "liveminutes"
version = "0.1.0"
description = "온디바이스 실시간 회의 자막·화자분리 + 근거 추적 AI 회의록"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    # API 서버 + WebSocket 오디오 수신 (결재 2: FastAPI + Streamlit 2프로세스)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    # 설정 / 구조화 모델
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-dotenv>=1",
    # 오디오 배관 (Phase 1: 리샘플·wav 저장)
    "numpy>=2",
    "soundfile>=0.12",
    "rich>=13",
]

# 무거운 ML·UI 스택은 extras 로 분리한다.
# 이유: mlx 계열은 Apple Silicon 전용이라 리눅스 CI 에서 해석·설치가 불가능하고,
#       torch 를 끌고 오는 화자분리 스택은 lint/test 게이트에 불필요하다.
[project.optional-dependencies]
# STT — mlx-whisper 0.4.3 (Apple Silicon 전용, 마커로 리눅스 제외)
asr = [
    "mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# 화자분리 — pyannote.audio 4.0.7 + numpy 2 (본체 .venv)
diar = [
    "pyannote.audio==4.0.7",
    "torch>=2.4",
    "torchaudio>=2.4",
]
# 데모 UI (결재 2). httpx 로 API 를 폴링한다 — dev 그룹 없이도 떠야 한다.
ui = ["streamlit>=1.38", "httpx>=0.27"]
# 회의록 생성 — LangGraph 6단계 (결재 4)
minutes = ["langgraph>=1.0", "langchain>=1.0"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",      # fastapi TestClient 요구
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/liveminutes"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unused_ignores = true
# 서드파티 스텁 부재는 게이트를 막지 않는다 (mlx/pyannote 는 스텁 미배포)
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "audio: 실제 오디오 장치·파일이 필요한 테스트 (CI 제외)",
    "model: 모델 가중치 로드가 필요한 테스트 (T7 마운트 필요, CI 제외)",
]
